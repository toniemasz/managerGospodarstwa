name: Temporary test verification

on:
  pull_request:
    branches:
      - agent/ci-feed-tests-base

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "1"
      SECRET_KEY: test-secret-key
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Run production completion tests
        run: pytest feed/tests/integration/test_production_completion.py -q --tb=short

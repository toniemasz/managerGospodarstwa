name: Temporary test verification

on:
  pull_request:
    branches:
      - agent/ci-feed-tests-base

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: "1"
      SECRET_KEY: test-secret-key
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Run all verification suites
        shell: bash
        run: |
          set +e
          pytest feed/tests/integration/test_production_completion.py -q --tb=short > production-output.txt 2>&1
          production_code=$?
          pytest feed/tests -q --tb=short > feed-output.txt 2>&1
          feed_code=$?
          pytest -q --tb=short > full-output.txt 2>&1
          full_code=$?
          printf '%s\n' "$production_code" > production-exit-code.txt
          printf '%s\n' "$feed_code" > feed-exit-code.txt
          printf '%s\n' "$full_code" > full-exit-code.txt
          exit 0
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-test-output
          path: |
            production-output.txt
            feed-output.txt
            full-output.txt
            production-exit-code.txt
            feed-exit-code.txt
            full-exit-code.txt
          if-no-files-found: error
      - name: Fail when any test suite failed
        shell: bash
        run: |
          production_code="$(cat production-exit-code.txt)"
          feed_code="$(cat feed-exit-code.txt)"
          full_code="$(cat full-exit-code.txt)"
          echo '=== production completion tests ==='
          cat production-output.txt
          echo '=== feed tests ==='
          cat feed-output.txt
          echo '=== full test suite ==='
          cat full-output.txt
          if [ "$production_code" -ne 0 ] || [ "$feed_code" -ne 0 ] || [ "$full_code" -ne 0 ]; then
            exit 1
          fi

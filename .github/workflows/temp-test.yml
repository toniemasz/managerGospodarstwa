name: Temporary test verification

on:
  pull_request:
    branches:
      - agent/ci-feed-tests-base

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "1"
      SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run production completion tests
        run: pytest feed/tests/integration/test_production_completion.py -q
      - name: Run feed tests
        run: pytest feed/tests -q
      - name: Run full test suite
        run: pytest -q

name: Temporary test verification

on:
  pull_request:
    branches:
      - agent/ci-feed-tests-base

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "1"
      SECRET_KEY: test-secret-key
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Run production completion tests
        shell: bash
        run: |
          set +e
          pytest feed/tests/integration/test_production_completion.py -q --tb=short > test-output.txt 2>&1
          echo $? > test-exit-code.txt
          exit 0
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-test-output
          path: |
            test-output.txt
            test-exit-code.txt
          if-no-files-found: error
      - name: Fail when tests failed
        shell: bash
        run: |
          code="$(cat test-exit-code.txt)"
          cat test-output.txt
          exit "$code"

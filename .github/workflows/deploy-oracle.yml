name: Deploy to Oracle

on:
  workflow_run:
    workflows:
      - Main pull request tests
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Przygotowanie SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/oracle_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/known_hosts

      - name: Sprawdzenie połączenia
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/oracle_deploy_key \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo 'Połączenie SSH działa.'"

      - name: Wdrożenie aplikacji
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -i ~/.ssh/oracle_deploy_key \
            "$ORACLE_USER@$ORACLE_HOST" \
            "sudo /usr/local/bin/deploy-manager-gospodarstwa"

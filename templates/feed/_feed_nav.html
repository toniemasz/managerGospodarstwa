{% if messages %}
<div class="mb-4">
    {% for message in messages %}
    <div class="p-4 rounded-lg shadow-sm font-bold {% if message.tags == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}

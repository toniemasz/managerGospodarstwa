<div class="filter-field"><label for="period">Okres statystyk</label><select id="period" name="period">{% for value, label in period_options %}<option value="{{ value }}" {% if date_filter.period == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="filter-field"><label for="date_from">Od</label><input id="date_from" type="date" name="date_from" value="{{ date_filter.date_from_value }}"></div>
<div class="filter-field"><label for="date_to">Do</label><input id="date_to" type="date" name="date_to" value="{{ date_filter.date_to_value }}"></div>

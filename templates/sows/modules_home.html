<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Gospodarstwa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6 max-w-4xl">
        <header class="mb-8 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm">
            <h1 class="text-2xl font-bold text-gray-800">🚜 Centrala Gospodarstwa</h1>
            <a href="{% url 'logout' %}" class="text-sm bg-red-100 hover:bg-red-200 text-red-800 font-medium px-3 py-1.5 rounded">Wyloguj</a>
        </header>

        <h2 class="text-lg font-semibold text-gray-600 mb-4">Dostępne moduły systemu:</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <a href="{% url 'dashboard' %}" class="block bg-white p-6 rounded-lg shadow-sm hover:shadow-md border-t-4 border-pink-500 transition">
                <div class="flex items-center space-x-4">
                    <span class="text-4xl">🐖</span>
                    <div>
                        <h3 class="text-xl font-bold text-gray-800">Moduł: Maciory</h3>
                        <p class="text-sm text-gray-500 mt-1">Zarządzanie cyklem rozrodczym, rejestracja wyproszeń, odsadzeń oraz alerty szczepień ochronnych.</p>
                    </div>
                </div>
            </a>

            <div class="bg-gray-50 p-6 rounded-lg border border-dashed border-gray-300 opacity-60">
                <div class="flex items-center space-x-4">
                    <span class="text-4xl">🚜</span>
                    <div>
                        <h3 class="text-xl font-bold text-gray-400">Moduł: Magazyn i Pasze</h3>
                        <p class="text-sm text-gray-400 mt-1">Dostępne wkrótce. Kontrola stanów magazynowych komponentów paszowych i silosów.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

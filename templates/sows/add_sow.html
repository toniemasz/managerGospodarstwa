{% extends 'base.html' %}
{% block title %}Dodaj Maciorę{% endblock %}

{% block content %}
<main class="app-page app-page-narrow">
    <section class="page-header">
        <div>
            <p class="eyebrow">Maciory</p>
            <h1>Dodaj maciorę</h1>
            <p class="page-subtitle">Nowy rekord zostanie przypisany do bieżącego gospodarstwa.</p>
        </div>
        <a href="{% url 'dashboard' %}" class="button button-secondary">Wróć</a>
    </section>

    <section class="panel">
        <form method="post" class="responsive-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
            {% endfor %}
            <div class="form-actions">
                <a href="{% url 'dashboard' %}" class="button button-secondary">Anuluj</a>
                <button type="submit" class="button button-primary">Zapisz</button>
            </div>
        </form>
    </section>
</main>
{% endblock %}

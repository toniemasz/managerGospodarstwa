<dialog class="confirmation-dialog" data-confirmation-dialog aria-labelledby="confirmation-dialog-title" aria-describedby="confirmation-dialog-message">
    <div class="dialog-card">
        <div>
            <h2 id="confirmation-dialog-title" class="section-title">Potwierdź operację</h2>
            <p id="confirmation-dialog-message" data-confirmation-message></p>
        </div>
        <div class="form-actions">
            <button type="button" class="button button-secondary" data-confirmation-cancel>Anuluj</button>
            <button type="button" class="button button-danger" data-confirmation-accept>Potwierdź</button>
        </div>
    </div>
</dialog>

{# Global delete confirmation modal #}
{# Include this in base.html in {% block scripts %} section #}

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-6 max-w-sm w-full mx-4">
        <h2 class="text-lg font-bold text-gray-800 mb-4">
            ⚠️ Potwierdź usunięcie
        </h2>
        <p class="text-gray-600 mb-6">
            Czy na pewno chcesz usunąć <strong id="deleteItemName">element</strong>? 
            Tej operacji <strong>nie można będzie cofnąć</strong>.
        </p>
        <div class="flex gap-3 justify-end">
            <button type="button" 
                    id="cancelDeleteBtn"
                    class="px-4 py-2 rounded border border-gray-300 text-gray-700 hover:bg-gray-50 font-semibold transition">
                Anuluj
            </button>
            <button type="button" 
                    id="confirmDeleteBtn"
                    class="px-4 py-2 rounded bg-red-600 hover:bg-red-700 text-white font-semibold transition">
                Usuń
            </button>
        </div>
    </div>
</div>

<div class="form-field{% if field.errors %} has-error{% endif %}{% if wide %} form-field-full{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="checkbox-row">{{ field }}<span>{{ field.label }}</span></label>
    {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<p class="field-hint">{{ field.help_text }}</p>{% endif %}
    {{ field.errors }}
</div>

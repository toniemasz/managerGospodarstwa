{% extends 'base.html' %}
{% block title %}Nowa Sprzedaż{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Dodaj dokument sprzedaży</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">{{ field.label }}</label>
                {{ field.errors }}
                {{ field }}
            </div>
            {% endfor %}
            <div class="flex justify-between items-center pt-4 border-t">
                <a href="{% url 'sales_list' %}" class="text-gray-500 hover:text-gray-800 text-sm font-bold">Anuluj</a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow">Zapisz</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
